{% extends "layout.html" %}

{% block title %}
    Add book
{% endblock %}

{% block main %}
<div class="container mt-4">
    <h2 class="mb-4">Agregar libro</h2>

    <form action="/add_book" method="post" class="row g-3">

        <div class="col-md-12">
            <label for="title" class="form-label">Título</label>
            <input type="text" class="form-control" id="title" name="title" required>
        </div>

        <div class="col-md-6">
            <label for="author" class="form-label">Autor</label>
            <input type="text" class="form-control" id="author" name="author">
        </div>

        <div class="col-md-6">
            <label for="publisher" class="form-label">Editorial</label>
            <input type="text" class="form-control" id="publisher" name="publisher">
        </div>

        <div class="col-md-4">
            <label for="year" class="form-label">Año de publicación</label>
            <input type="number" class="form-control" id="year" name="year" min="0" max="2100">
        </div>

        <div class="col-md-4">
            <label for="isbn" class="form-label">ISBN</label>
            <input type="text" class="form-control" id="isbn" name="isbn">
        </div>

        <div class="col-md-4">
            <label for="language" class="form-label">Idioma</label>
            <input type="text" class="form-control" id="language" name="language">
        </div>

        <div class="col-md-12">
            <label for="category" class="form-label">Categoría</label>
            <input type="text" class="form-control" id="category" name="category">
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">Agregar libro</button>
        </div>
    </form>
</div>
{% endblock %}
