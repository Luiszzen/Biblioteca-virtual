{% extends "layout.html" %}

{% block title %}
    Admin - Editar usuario
{% endblock %}

{% block main %}
<div class="container mt-4" style="max-width: 640px;">
    <h2 class="mb-1">{{ user.username }}</h2>
    <p><a href="/admin/users">← Volver a usuarios</a></p>

    <h4 class="mt-4">Perfil</h4>
    <form action="/admin/users/{{ user.id }}" method="post">

        <div class="mb-3">
            <label class="form-label" for="full_name">Nombres y apellidos</label>
            <input class="form-control" id="full_name" name="full_name" type="text" value="{{ user.full_name or '' }}">
        </div>

        <div class="mb-3">
            <label class="form-label" for="turno">Turno</label>
            <select class="form-select" id="turno" name="turno">
                <option value="" {% if not user.turno %}selected{% endif %}>(sin definir)</option>
                {% for value, label in turnos.items() %}
                    <option value="{{ value }}" {% if user.turno == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label" for="grado">Grado</label>
            <select class="form-select" id="grado" name="grado">
                <option value="" {% if not user.grado %}selected{% endif %}>(sin definir)</option>
                {% for g in grados %}
                    <option value="{{ g }}" {% if user.grado|string == g %}selected{% endif %}>{{ g }}°</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label" for="seccion">Sección</label>
            <select class="form-select" id="seccion" name="seccion">
                <option value="" {% if not user.seccion %}selected{% endif %}>(sin definir)</option>
                {% for s in secciones %}
                    <option value="{{ s }}" {% if user.seccion == s %}selected{% endif %}>{{ s }}</option>
                {% endfor %}
            </select>
        </div>

        <button class="btn btn-primary" type="submit">Guardar perfil</button>
    </form>

    <hr class="my-5">

    <h4>Restablecer contraseña</h4>
    <p class="text-muted">Escribe una contraseña temporal y entrégasela al usuario en persona.</p>
    <form action="/admin/users/{{ user.id }}/password" method="post">
        <div class="mb-3">
            <input class="form-control" name="new_password" placeholder="Nueva contraseña (mínimo 6 caracteres)" required type="password" autocomplete="new-password">
        </div>
        <div class="mb-3">
            <input class="form-control" name="confirmation" placeholder="Confirmar nueva contraseña" required type="password" autocomplete="new-password">
        </div>
        <button class="btn btn-warning" type="submit">Restablecer contraseña</button>
    </form>
</div>
{% endblock %}
